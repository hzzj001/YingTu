apply plugin: 'com.android.application'

android {
    namespace 'com.yingtu.plus'
    compileSdk 34
    
    defaultConfig {
        applicationId "com.yingtu.plus"
        minSdk 24
        targetSdk 34
        versionCode 32
        versionName "2.0.1"
        // P0 版本修复：versionCode 32 高于已发 v1.9.22 APK 的 31，避免装到已装 1.9.22 的手机上报降级安装失败；targetSdk/compileSdk 保持 34 不动。
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 禁用 AAR 元数据检查（nextlib AAR 的 minCompileSdk=37，CI 的 SDK 仓库无 android-37 包）
tasks.matching { it.name == 'checkDebugAarMetadata' || it.name == 'checkReleaseAarMetadata' }.configureEach {
    enabled = false
    onlyIf { false }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // 补：HomeMainFragment.java:11 import 了 androidx.gridlayout.widget.GridLayout（fragment_home_main.xml 的 quickGrid），缺了它 Java 编译与布局 inflate 都会失败。
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    implementation 'org.greenrobot:eventbus:3.3.1'
    implementation files('libs/nextlib-media3ext-1.10.0-0.12.1-fongmi-softload.aar')
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.simpleframework:simple-xml:2.7.1'
    implementation 'com.orhanobut:hawk:2.0.1'
    implementation 'com.google.guava:guava:33.3.1-android'
    implementation 'org.jupnp:org.jupnp:2.6.1'
    // 从上游 fish2018/webhtv 移植（libs.lottie = com.airbnb.android:lottie:6.7.1）：
    // view_empty.xml 里用了 LottieAnimationView（@raw/empty），缺了它空状态 inflate 就会 ClassNotFound。
    implementation 'com.airbnb.android:lottie:6.7.1'
    // VodFragment 移植后新增的依赖缺口（上游版本）：HomeWebController 用 androidx.webkit，
    // ScanActivity（扫码页）用 journeyapps 的 zxing-android-embedded（上游 mobile/leanback 双 flavor 都用它）。
    implementation 'androidx.webkit:webkit:1.16.0'
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation project(':catvod')
    implementation project(':quickjs')
}
