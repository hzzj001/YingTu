apply plugin: 'com.android.application'

// 第 24 轮：CI 解析到的 lifecycle 版本比声明的 2.7.0 新，新版删了 NewInstanceFactory、
// Factory.create(Class)、ViewModelProvider(Store, Factory)（Build #19/#20/#23 均因此失败）。
// 把 lifecycle 锁回 2.7.0（与本地声明版本一致，已用 2.7.0 AAR 核对：三个构造方法、
// NewInstanceFactory、create(Class) 都在）。不锁 lifecycle-service（media3-session 要用它）。
configurations.all {
    resolutionStrategy {
        force 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
        force 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
        force 'androidx.lifecycle:lifecycle-runtime:2.7.0'
        force 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
        force 'androidx.lifecycle:lifecycle-livedata:2.7.0'
        force 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
        force 'androidx.lifecycle:lifecycle-common:2.7.0'
    }
}


android {
    namespace 'com.yingtu.plus'
    compileSdk 36
    
    defaultConfig {
        applicationId "com.yingtu.plus"
        minSdk 24
        targetSdk 34
        versionCode 32
        versionName "2.0.1"
        buildConfigField "String", "MEDIA3_VERSION", "\"1.11.0-alpha01-fongmi\""
        // 第 20 轮：上游用 productFlavors 生成 FLAVOR_mode/FLAVOR_abi；本地不用 flavor（改 APK 输出路径会断工作流上传），改用固定值。
        buildConfigField "String", "FLAVOR_mode", "\"mobile\""
        buildConfigField "String", "FLAVOR_abi", "\"arm64_v8a\""
        // 第 21 轮：补上游 build.gradle:43-47 的 5 个字段，固定占位值（不引入 git 命令；只影响 About/诊断文案显示）。
        buildConfigField "String", "BUILD_TIME", "\"20261108\""
        buildConfigField "String", "BUILD_TAG", "\"2.0.1\""
        buildConfigField "String", "GIT_REVISION", "\"b7c00f6\""
        buildConfigField "String", "GIT_STATE", "\"snapshot\""
        buildConfigField "String", "MPV_NATIVE_SOURCES", "\"\""
        // P0 版本修复：versionCode 32 高于已发 v1.9.22 APK 的 31，避免装到已装 1.9.22 的手机上报降级安装失败；targetSdk 保持 34 不动；compileSdk 升到 36（media3 1.11.0 的 AAR 元数据要求 minCompileSdk=36）。
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 上游 fish2018/webhtv 同款：Build #7 缺 BuildConfig（16 个文件）与 databinding 类（39 个文件），
    // 本地无 DataBindingUtil / BR 用法，viewBinding 足以为全部布局生成 XxxBinding 类。
    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    // jdtech libmpv 自带 FFmpeg 7.1.1 的 .so（libavcodec/libavutil/libswresample/libswscale），
    // 与 nextlib-media3ext Maven 产物（r4）自带的 FFmpeg 9.0.1 同名同路径；
    // 不加 pickFirsts 会在 mergeDebugNativeLibs 报重复文件。声明顺序在前者优先（nextlib 先声明），
    // 即 FFmpeg 9.0.1 的副本进包：ExoPlayer 的 ffmpeg 扩展用它；旧 mpv 核心（MpvPlayerCore）
    // 建在 7.1.1 上，运行时加载到 9.0.1 副本有缺符号风险——旧核心本就只是过渡，默认播放器是 Exo。
    packagingOptions {
        jniLibs {
            pickFirsts += ['lib/arm64-v8a/libavcodec.so', 'lib/arm64-v8a/libavutil.so',
                           'lib/arm64-v8a/libswresample.so', 'lib/arm64-v8a/libswscale.so',
                           'lib/armeabi-v7a/libavcodec.so', 'lib/armeabi-v7a/libavutil.so',
                           'lib/armeabi-v7a/libswresample.so', 'lib/armeabi-v7a/libswscale.so',
                           'lib/x86/libavcodec.so', 'lib/x86/libavutil.so',
                           'lib/x86/libswresample.so', 'lib/x86/libswscale.so',
                           'lib/x86_64/libavcodec.so', 'lib/x86_64/libavutil.so',
                           'lib/x86_64/libswresample.so', 'lib/x86_64/libswscale.so']
        }
    }
}

// 禁用 AAR 元数据检查（nextlib r4 产物的 minCompileSdk=37，CI 的 SDK 仓库无 android-37 包）
tasks.matching { it.name == 'checkDebugAarMetadata' || it.name == 'checkReleaseAarMetadata' }.configureEach {
    enabled = false
    onlyIf { false }
}

// 构建时下载二进制依赖（二进制文件不能进仓库：快照推送只接受 UTF-8 文本；
// CI 机器是临时的，每次都要拉）。文件已存在且非零时跳过，避免重复下载。
def ensureDownloaded(String url, File dest) {
    if (dest.exists() && dest.length() > 0) {
        logger.lifecycle("已存在，跳过下载: ${dest}")
        return
    }
    dest.parentFile.mkdirs()
    logger.lifecycle("下载 ${url} -> ${dest}")
    new URL(url).withInputStream { input ->
        dest.withOutputStream { output ->
            output << input
        }
    }
    if (!dest.exists() || dest.length() == 0) {
        throw new GradleException("下载失败，文件为空: ${url}")
    }
}

tasks.register('downloadIjkNativeLibs') {
    doLast {
        // ijk 播放器 .so（上游 fish2018/webhtv 仓库，commit 4e30ffa），约 17MB；
        // IjkMediaPlayer 只加载 ijkffmpeg / ijksdl / ijkplayer 三个。
        def base = 'https://raw.githubusercontent.com/fish2018/webhtv/4e30ffa/app/src/main/jniLibs'
        ['arm64-v8a', 'armeabi-v7a'].each { abi ->
            ['libijkffmpeg.so', 'libijkplayer.so', 'libijksdl.so'].each { name ->
                ensureDownloaded("${base}/${abi}/${name}", file("src/main/jniLibs/${abi}/${name}"))
            }
        }
    }
}

tasks.register('downloadVendorAars') {
    doLast {
        // 迅雷 / 鉴片 / forcetech / tvbus 四个闭源 AAR（上游 app/libs，commit 4e30ffa），约 10MB；
        // hook-release.aar 不用（Hook 类本地已有源码，Chromium 无人引用）。
        def base = 'https://raw.githubusercontent.com/fish2018/webhtv/4e30ffa/app/libs'
        ['forcetech-release', 'jianpian-release', 'thunder-release', 'tvbus-release'].each { name ->
            ensureDownloaded("${base}/${name}.aar", file("libs/${name}.aar"))
        }
    }
}

tasks.named('preBuild') {
    dependsOn 'downloadIjkNativeLibs', 'downloadVendorAars'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // 补：HomeMainFragment.java:11 import 了 androidx.gridlayout.widget.GridLayout（fragment_home_main.xml 的 quickGrid），缺了它 Java 编译与布局 inflate 都会失败。
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.room:room-runtime:2.8.4'
    annotationProcessor 'androidx.room:room-compiler:2.8.4'
    // Room 2.6.1 → 2.8.4（上游 libs.versions.toml:18 同款）：ConfigDao.java:20 用的 RoomWarnings.QUERY_MISMATCH 在 2.6.1 里不存在。
    implementation 'org.greenrobot:eventbus:3.3.1'
    // nextlib FFmpeg 扩展（上游 libs.nextlib.media3ext 同款；本地旧 AAR 无 Java 类，缺 FfmpegAudioRenderer 等）。
    // 用 r4（上游 third_party/maven 仓库实际有的版本；toml 写的是 r5，但仓库里只有 r4，以实际能拿到为准；仓库见 settings.gradle）。
    // 声明位置保持在 libmpv 之前，让 nextlib 的 FFmpeg .so 优先（见上面 packagingOptions 的注释）。
    implementation 'io.github.anilbeesetti:nextlib-media3ext:1.10.0-0.12.1-fongmi-softload-av3a-avs3-ffmpeg901-r4'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.simpleframework:simple-xml:2.7.1'
    implementation 'com.orhanobut:hawk:2.0.1'
    implementation 'com.google.guava:guava:33.3.1-android'
    implementation 'org.jupnp:org.jupnp:2.6.1'
    // 从上游 fish2018/webhtv 移植（libs.lottie = com.airbnb.android:lottie:6.7.1）：
    // view_empty.xml 里用了 LottieAnimationView（@raw/empty），缺了它空状态 inflate 就会 ClassNotFound。
    implementation 'com.airbnb.android:lottie:6.7.1'
    // VodFragment 移植后新增的依赖缺口（上游版本）：HomeWebController 用 androidx.webkit，
    // ScanActivity（扫码页）用 journeyapps 的 zxing-android-embedded（上游 mobile/leanback 双 flavor 都用它）。
    implementation 'androidx.webkit:webkit:1.16.0'
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // media3 分叉版 1.11.0-alpha01-fongmi（上游 fish2018/webhtv 同款 bundle，见 gradle/libs.versions.toml:151）：
    // Build #7 缺 androidx.media3.*，96 个文件引用；官方 1.11.0 没有分叉新增的类（MediaEdition、蓝光 ISO、弹幕、mpvplayer），
    // 故整组用分叉版，仓库见 settings.gradle（上游 third_party/maven 的 raw URL）。
    implementation 'androidx.media3:media3-common:1.11.0-alpha01-fongmi'
    implementation 'androidx.media3:media3-container:1.11.0-alpha01-fongmi'
    implementation 'androidx.media3:media3-database:1.11.0-alpha01-fongmi'
    implementation 'androidx.media3:media3-datasource:1.11.0-alpha01-fongmi'
    implementation 'androidx.media3:media3-datasource-okhttp:1.11.0-alpha01-fongmi'
    implementation 'androidx.media3:media3-datasource-rtmp:1.11.0-alpha01-fongmi'
    implementation 'androidx.media3:media3-decoder:1.11.0-alpha01-fongmi'
    implementation 'androidx.media3:media3-effect:1.11.0-alpha01-fongmi'
    implementation 'androidx.media3:media3-exoplayer:1.11.0-alpha01-fongmi'
    implementation 'androidx.media3:media3-exoplayer-dash:1.11.0-alpha01-fongmi'
    implementation 'androidx.media3:media3-exoplayer-hls:1.11.0-alpha01-fongmi'
    implementation 'androidx.media3:media3-exoplayer-rtsp:1.11.0-alpha01-fongmi'
    implementation 'androidx.media3:media3-exoplayer-smoothstreaming:1.11.0-alpha01-fongmi'
    implementation 'androidx.media3:media3-extractor:1.11.0-alpha01-fongmi'
    implementation 'androidx.media3:media3-session:1.11.0-alpha01-fongmi'
    implementation 'androidx.media3:media3-ui:1.11.0-alpha01-fongmi'
    implementation 'androidx.media3:media3-ui-danmaku:1.11.0-alpha01-fongmi'
    // 旧 mpv 核心 MpvPlayerCore 用 dev.jdtech.mpv.MPVLib。1.0.0 的 MPVLib.class 是 Java 21 编的，
    // 工作流 JDK 17 读不了（Build #9 报错 class file has wrong version 65.0, should be 61.0），
    // 降到 0.5.1（class 版本 52=Java 8，已用 javap 核对 MpvPlayerCore 全部用法都在 0.5.1 里）。
    implementation 'dev.jdtech.mpv:libmpv:0.5.1'
    // MpvHlsProxy 与 WebServer 用 NanoHTTPD（上游 libs.versions.toml:46 同款 2.3.1，Maven Central 有）。
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    // CustomWallView 用 androidx.palette 与 android-gif-drawable（上游 libs.versions.toml 同款：palette 1.0.0、androidGifDrawable 1.2.31）。
    implementation 'androidx.palette:palette:1.0.0'
    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.31'
    // Youtube.java 用 NewPipeExtractor（上游 libs.versions.toml:47 同款 v0.26.3，JitPack；settings.gradle 已有 jitpack 仓库）。
    // 已知风险：JitPack 之前出现过 401，若 CI 再报 401 需另想办法。
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.3'
    // 第 21 轮：ImgUtil 用 TextDrawable.Builder（上游 libs.versions.toml 同款 1.0.3，JitPack）。
    implementation 'com.github.jahirfiquitiva:TextDrawable:1.0.3'
    // Build #11 剩下的缺失依赖（均按上游 libs.versions.toml 版本）：
    // TypeDialog 用 FlexboxLayoutManager（上游 flexbox 3.0.0，Google Maven）。
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    // AssInput 用 UniversalDetector（上游 juniversalchardet 1.0.3，Maven Central）。
    implementation 'com.googlecode.juniversalchardet:juniversalchardet:1.0.3'
    // PermissionCallback / PermissionUtil 用 PermissionX（上游 permissionx 1.8.1，Maven Central）。
    implementation 'com.guolindev.permissionx:permissionx:1.8.1'
    // OkGlideModule 用 OkHttpUrlLoader（与本地 glide 4.16.0 同版本；上游 glide 是 5.0.7，但本地是 4.16.0，不跟升）。
    implementation 'com.github.bumptech.glide:okhttp3-integration:4.16.0'
    // ColorGenerator 用 MDColor（上游 materialdesigncolors 1.0.0，JitPack）。
    // 第 26 轮：该库的 POM 拖了 com.android.support:appcompat-v7:24.2.1，进而拖进整套老 Support 库
    //（support-v4:24.2.1 → support-compat / support-media-compat），与 AndroidX core/media 类重复，
    // Build #25 栽在 checkDebugDuplicateClasses。MDColor 本身只是颜色常量，不需要老库，排除掉。
    implementation('com.github.bassaer:materialdesigncolors:1.0.0') {
        exclude group: 'com.android.support'
    }
    // DolbyVisionP81Extractor 用 LibDovi / FrameInfo 等（上游 exoplayerHdrUtils 0.4.0，Maven Central）。
    implementation 'com.suyashbelekar:exoplayerhdrutils:0.4.0'
    // BasicPitchTfliteGenerator 用 org.tensorflow.lite.Interpreter（上游 tensorflowLite 2.17.0，但该产物已迁移：
    // Maven Central 的 tensorflow-lite 2.17.0 .jar 请求返回的是带 relocation 到 com.google.ai.edge.litert:litert:1.0.1 的 POM，下不到真包；
    // 改用 litert 1.0.1（Google Maven），AAR 里含 Interpreter 与 4 架构 libtensorflowlite_jni.so，包名保持 org.tensorflow.lite 不变）。
    implementation 'com.google.ai.edge.litert:litert:1.0.1'
    // 迅雷 / 鉴片 / forcetech / tvbus 四个 AAR 由 downloadVendorAars 任务在 preBuild 前下载到 libs/；
    // libs/ 里遗留的旧 nextlib AAR（无 Java 类）排除在外——nextlib 现在走上面 Maven 产物，避免同一 AAR 依赖两次。
    implementation fileTree(dir: "libs", include: ["*.aar"], exclude: ["nextlib-media3ext-1.10.0-0.12.1-fongmi-softload.aar"])
    implementation project(':catvod')
    implementation project(':quickjs')
}
